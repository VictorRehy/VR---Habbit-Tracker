<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Road to MIT</title>

  <!-- Security & Privacy Hardening Headers -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="no-referrer">

  <!-- External Stylesheet -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles.css">

  <!-- External Application Logic -->
  <script src="app.js" defer></script>
</head>

<body>

  <div id="app">
    <header class="topbar">
      <div class="brand" onclick="openMotivationModal()" title="Click for daily motivation">
        <img src="logo.png" alt="Logo" class="brand-logo">
        <span class="brand-text">Road to MIT</span>
      </div>
      <div class="save-indicator" id="save-mobile">Saved at --:--</div>
    </header>

    <nav class="nav">
      <div class="nav-brand brand" onclick="openMotivationModal()" title="Click for daily motivation">
        <img src="logo.png" alt="Logo" class="brand-logo">
        <span class="brand-text">Road to MIT</span>
      </div>
      <a href="#/dashboard" class="nav-link active" data-route="dashboard">Dashboard</a>
      <a href="#/daily" class="nav-link" data-route="daily">Daily Track</a>
      <a href="#/weekly" class="nav-link" data-route="weekly">Monthly & Weekly</a>
      <a href="#/settings" class="nav-link" data-route="settings">Settings / Data</a>
    </nav>

    <div class="main-wrapper">
      <main class="main-content">
        <div class="card-header">
          <h2 id="page-title">Dashboard</h2>
          <div class="save-indicator" id="save-desktop">Saved at --:--</div>
        </div>
        <div id="content"></div>
      </main>
      <footer class="app-footer">
        &copy; VR_Tech
      </footer>
    </div>
  </div>

  <div id="toast-container" aria-live="polite"></div>

  <!-- Motivational Modal -->
  <div id="motivation-modal" class="modal-overlay" onclick="handleModalOverlayClick(event)">
    <div class="modal-content">
      <button class="modal-close" onclick="closeMotivationModal()" title="Close (Esc)">&times;</button>
      <h2 style="font-family: 'Noto Serif Display', serif; font-style: italic; margin-bottom: 1.5rem; text-align: center; color: var(--text-primary);">
        Road to MIT
      </h2>
      <div id="modal-quote-container" class="quote-card" style="margin-bottom: 2rem;"></div>
      <div id="modal-priority-container" class="card"
        style="border-left: 4px solid var(--warning); background: linear-gradient(to right, rgba(245, 158, 11, 0.05), var(--bg-surface)); margin-bottom: 0;">
      </div>
    </div>
  </div>

</body>

</html>
