<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Road to MIT</title>

  <!-- Security & Privacy Hardening Headers -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.firebase.com https://*.firebaseapp.com; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.googleusercontent.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com; frame-src 'self' https://*.firebaseapp.com; object-src 'none'; base-uri 'self'; form-action 'self';">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="no-referrer">

  <!-- External Stylesheet -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles.css">

  <!-- External Application Logic -->
  <script type="module" src="app.js" defer></script>
</head>

<body>

  <!-- Auth View -->
  <div id="auth-view" class="auth-container" style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: var(--bg-base);">
    <div class="card" style="width: 100%; max-width: 400px; padding: 2.5rem 2rem;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <img src="logo.png" alt="Logo" style="width: 60px; height: 60px; margin-bottom: 1rem;">
        <h2>Road to MIT</h2>
        <p class="text-muted">Sign in to sync your progress</p>
      </div>
      
      <form id="email-login-form" style="display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem;" onsubmit="event.preventDefault();">
        <input type="email" id="auth-email" placeholder="Email Address" required style="width: 100%;">
        <input type="password" id="auth-password" placeholder="Password" required style="width: 100%;">
        <div style="display: flex; gap: 1rem;">
          <button type="button" id="btn-login-email" class="btn btn-primary" style="flex: 1;">Login</button>
          <button type="button" id="btn-signup-email" class="btn btn-secondary" style="flex: 1;">Sign Up</button>
        </div>
        <div id="auth-error" style="color: var(--danger); font-size: 0.875rem; text-align: center; display: none; margin-top: 0.5rem;"></div>
      </form>
      
      <div style="display: flex; align-items: center; text-align: center; margin: 1.5rem 0;">
        <hr style="flex: 1; border: none; border-top: 1px solid var(--border-subtle);">
        <span style="padding: 0 10px; color: var(--text-muted); font-size: 0.875rem;">OR</span>
        <hr style="flex: 1; border: none; border-top: 1px solid var(--border-subtle);">
      </div>
      
      <button id="btn-login-google" class="btn btn-secondary" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.75rem;">
        <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Continue with Google
      </button>
    </div>
  </div>

  <!-- Main App View -->
  <div id="app" style="display: none;">
    <header class="topbar">
      <div class="brand" onclick="openMotivationModal()" title="Click for daily motivation">
        <img src="logo.png" alt="Logo" class="brand-logo">
        <span class="brand-text">Road to MIT</span>
      </div>
      <div style="display: flex; align-items: center;">
        <div class="save-indicator" id="save-mobile">Saved at --:--</div>
        <button id="btn-logout-mobile" class="btn" style="margin-left: 1rem; padding: 0.25rem 0.5rem; background: transparent; color: var(--text-muted); border: 1px solid var(--border-subtle);">Logout</button>
      </div>
    </header>

    <nav class="nav">
      <div class="nav-brand brand" onclick="openMotivationModal()" title="Click for daily motivation">
        <img src="logo.png" alt="Logo" class="brand-logo">
        <span class="brand-text">Road to MIT</span>
      </div>
      <a href="#/dashboard" class="nav-link active" data-route="dashboard">Dashboard</a>
      <a href="#/daily" class="nav-link" data-route="daily">Daily Track</a>
      <a href="#/weekly" class="nav-link" data-route="weekly">Monthly & Weekly</a>
      <a href="#/settings" class="nav-link" data-route="settings">Settings / Data</a>
    </nav>

    <div class="main-wrapper">
      <main class="main-content">
        <div class="card-header">
          <h2 id="page-title">Dashboard</h2>
          <div style="display: flex; align-items: center;">
            <div class="save-indicator" id="save-desktop">Saved at --:--</div>
            <button id="btn-logout-desktop" class="btn btn-secondary" style="margin-left: 1rem; padding: 0.25rem 0.75rem; font-size: 0.875rem;">Logout</button>
          </div>
        </div>
        <div id="content"></div>
      </main>
      <footer class="app-footer">
        &copy; VR_Tech
      </footer>
    </div>
  </div>

  <div id="toast-container" aria-live="polite"></div>

  <!-- Motivational Modal -->
  <div id="motivation-modal" class="modal-overlay" onclick="handleModalOverlayClick(event)">
    <div class="modal-content">
      <button class="modal-close" onclick="closeMotivationModal()" title="Close (Esc)">&times;</button>
      <h2 style="font-family: 'Noto Serif Display', serif; font-style: italic; margin-bottom: 1.5rem; text-align: center; color: var(--text-primary);">
        Road to MIT
      </h2>
      <div id="modal-quote-container" class="quote-card" style="margin-bottom: 2rem;"></div>
      <div id="modal-priority-container" class="card"
        style="border-left: 4px solid var(--warning); background: linear-gradient(to right, rgba(245, 158, 11, 0.05), var(--bg-surface)); margin-bottom: 0;">
      </div>
    </div>
  </div>

</body>

</html>
